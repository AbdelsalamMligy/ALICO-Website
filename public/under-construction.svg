<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-labelledby="t d">
  <title id="t">Coming soon - under construction</title>
  <desc id="d">A yellow construction sign reading Coming Soon, topped with a yellow hard hat, standing behind a black and yellow striped barrier with two orange traffic cones under a blue sky.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fbbea"/>
      <stop offset="1" stop-color="#dcefff"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#ffe27a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdb9ae"/>
      <stop offset="1" stop-color="#a29e92"/>
    </linearGradient>
    <linearGradient id="sign" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23a"/>
      <stop offset="1" stop-color="#f7b500"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23a"/>
      <stop offset="1" stop-color="#f5a800"/>
    </linearGradient>
    <linearGradient id="coneGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a1a"/>
      <stop offset="0.5" stop-color="#ff5a00"/>
      <stop offset="1" stop-color="#d94a00"/>
    </linearGradient>
    <pattern id="hazard" width="44" height="44" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="44" height="44" fill="#ffc20e"/>
      <rect width="22" height="44" fill="#1f1f1f"/>
    </pattern>
  </defs>

  <!-- sky -->
  <rect width="800" height="460" fill="url(#sky)"/>
  <circle cx="690" cy="85" r="78" fill="url(#sun)"/>
  <circle cx="690" cy="85" r="30" fill="#ffe680"/>
  <g fill="#fff" opacity="0.95">
    <ellipse cx="120" cy="85" rx="58" ry="19"/>
    <ellipse cx="156" cy="72" rx="40" ry="17"/>
    <ellipse cx="505" cy="62" rx="48" ry="15"/>
    <ellipse cx="533" cy="52" rx="32" ry="13"/>
  </g>

  <!-- gears -->
  <g opacity="0.55" fill="none" stroke="#7d8896">
    <g transform="translate(85 215)">
      <circle r="34" stroke-width="12" stroke-dasharray="9 8.8"/>
      <circle r="20" stroke-width="18"/>
    </g>
    <g transform="translate(722 245)">
      <circle r="26" stroke-width="10" stroke-dasharray="7 6.8"/>
      <circle r="15" stroke-width="14"/>
    </g>
  </g>

  <!-- ground -->
  <rect y="390" width="800" height="70" fill="url(#ground)"/>
  <rect y="390" width="800" height="5" fill="#8f8b80"/>

  <!-- sign posts -->
  <rect x="220" y="280" width="14" height="112" fill="#5f6368"/>
  <rect x="566" y="280" width="14" height="112" fill="#5f6368"/>

  <!-- hard hat -->
  <rect x="385" y="34" width="30" height="40" rx="6" fill="#e69a00" stroke="#7a4f00" stroke-width="2"/>
  <path d="M335 92 A65 52 0 0 1 465 92 Z" fill="url(#hat)" stroke="#7a4f00" stroke-width="2"/>
  <rect x="318" y="88" width="164" height="14" rx="7" fill="#e69a00" stroke="#7a4f00" stroke-width="2"/>

  <!-- sign -->
  <rect x="170" y="102" width="460" height="190" rx="16" fill="url(#sign)" stroke="#212121" stroke-width="6"/>
  <rect x="186" y="118" width="428" height="158" rx="8" fill="none" stroke="#212121" stroke-width="3"/>
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-weight="800" fill="#212121" text-anchor="middle">
    <text x="400" y="192" font-size="52">COMING SOON</text>
    <text x="400" y="248" font-size="25" letter-spacing="3">UNDER CONSTRUCTION</text>
  </g>

  <!-- barrier -->
  <rect x="110" y="320" width="580" height="46" fill="url(#hazard)" stroke="#212121" stroke-width="4"/>
  <rect x="140" y="366" width="14" height="26" fill="#5f6368"/>
  <rect x="646" y="366" width="14" height="26" fill="#5f6368"/>

  <!-- cones -->
  <g id="cone">
    <path d="M55 388 L68 318 L82 318 L95 388 Z" fill="url(#coneGrad)"/>
    <polygon points="64.3,338 85.7,338 88.9,355 61.1,355" fill="#fff"/>
    <rect x="49" y="386" width="52" height="8" rx="3" fill="#2b2b2b"/>
  </g>
  <use href="#cone" x="655"/>
</svg>
