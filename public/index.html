    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

<body>
    <header class="header">
        <div class="header-inner">
            <a class="logo" href="/" aria-label="ALICO - العربية للصناعات الخفيفة">

            <a class="lang-toggle" href="/en/" hreflang="en" lang="en" aria-label="English">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>

                    نجهّز لك جودة تستحقها ونظافة تستمتع بها.
                    موقعنا قيد الإنشاء حالياً، يرجى العودة قريباً.
                </p>
            </div>

            <div class="hero-visual">
                <div class="hero-frame">
                    <img src="/under-construction-ar.svg" alt="قريباً - الموقع قيد الإنشاء">
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        &copy; 2026 العربية للصناعات الخفيفة (ALICO). جميع الحقوق محفوظة.
